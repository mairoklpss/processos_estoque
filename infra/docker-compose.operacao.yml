name: brasilink-operacao
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: brasilink_operacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_OPERACAO_PASSWORD:?Chave operacional deve ser injetada pelo inicializador local}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_operacao:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brasilink_operacao"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    mem_limit: 768m
volumes:
  postgres_operacao:
